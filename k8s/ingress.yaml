apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: friendmap-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/websocket-services: "api-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: friendmap.local
    http:
      paths:
      # API routes (HTTP + Socket.IO). Paths are passed through unchanged.
      - path: /(auth|health|friendships|sharing|location|messages|uploads|socket\.io).*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-service
            port:
              number: 3000
      # Everything else is the SPA, served by the web container.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80